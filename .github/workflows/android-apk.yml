name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor CLI + Android platform
        run: |
          bun add -d @capacitor/cli@latest
          bun add @capacitor/core@latest @capacitor/android@latest

      - name: Prepare web placeholder (app loads remote URL)
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Loading</title>
          <meta http-equiv="refresh" content="0; url=https://ceir.lovable.app">
          <p>Loading…</p>
          EOF

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Add camera + internet permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Insert permissions just before <application>
          for PERM in \
            "android.permission.CAMERA" \
            "android.permission.INTERNET" \
            "android.permission.RECORD_AUDIO" \
            "android.permission.MODIFY_AUDIO_SETTINGS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|    <uses-permission android:name=\"$PERM\" />\n    <application|" "$MANIFEST"
            fi
          done
          # Add camera features (optional)
          if ! grep -q "android.hardware.camera" "$MANIFEST"; then
            sed -i "s|<application|    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <application|" "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Patch MainActivity to grant WebView camera permission
        run: |
          MA=$(find android/app/src/main/java -name "MainActivity.java" | head -n1)
          cat > "$MA" <<'EOF'
          package app.lovable.ceir;

          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Request runtime camera permission
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                          new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO}, 1);
                  }
                  // Grant camera to WebView (getUserMedia)
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }
          }
          EOF
          cat "$MA"

      - name: Set version code
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle || true

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ceir12345 -keypass ceir12345 \
            -dname "CN=CEIR, OU=App, O=Lovable, L=NA, S=NA, C=US"

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'ceir12345'
                      keyAlias 'release'
                      keyPassword 'ceir12345'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/imei-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: imei-scanner-apk
          path: dist/imei-scanner.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IMEI SCANNER v1.0.${{ github.run_number }}
          files: dist/imei-scanner.apk
          generate_release_notes: true
